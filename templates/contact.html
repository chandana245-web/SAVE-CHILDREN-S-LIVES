{% extends 'base.html' %}
{% block title %}Contact | Save Children’s Lives{% endblock %}
{% block content %}
<section class="container page-section narrow">
  <div class="panel form-panel">
    <div class="heading-row">
      <div>
        <span class="eyebrow">Contact</span>
        <h1>Get in touch</h1>
      </div>
      <span class="demo-tag">DEMO</span>
    </div>

    <form method="post" action="{{ url_for('contact') }}" class="auth-form wide-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="two-col">
        <div class="field-group"><label>Name</label><input type="text" name="name" required /></div>
        <div class="field-group"><label>Email</label><input type="email" name="email" required /></div>
      </div>
      <div class="field-group"><label>Subject</label><input type="text" name="subject" required /></div>
      <div class="field-group"><label>Message</label><textarea name="message" rows="5" required></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Send Message</button>
    </form>
  </div>
</section>
{% endblock %}
